packages:
  - packages/*
enableGlobalVirtualStore: false
allowBuilds:
  better-sqlite3: true
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@cloudflare/oxlint-config@0.2.0"
